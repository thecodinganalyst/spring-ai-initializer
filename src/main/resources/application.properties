spring.application.name=spring-ai-demo
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.3

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:1.7b
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-ctx=4096
spring.ai.ollama.chat.keep-alive=30s

logging.level.org.springframework.ai.chat.client.advisor=DEBUG